<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quote Galau</title>
    <style>
        body {
            font-family: 'Courier New', Courier, monospace;
            text-align: center;
            font-weight: bold;
            color: rgb(61, 61, 61);
        }

        h1 {
            font-size: 48px;
            text-transform: uppercase;
            text-decoration: underline wavy;
            text-decoration-skip-ink: none;
            text-decoration-color: rgb(100, 100, 100);
            text-shadow: 5px 5px 0 rgb(215, 215, 215);
            font-style: italic;
            letter-spacing: 10px;
        }

        .quote {
            font-size: 22px;
            line-height: 2.2;
            word-spacing: 5px;
        }

        span {
            color: rgb(181, 181, 181);
            text-decoration: line-through;
        }

        .credit {
            font-weight: normal;
            letter-spacing: 2px;
            font-size: 12px;
            color: rgb(151, 151, 151);
        }
    </style>
</head>
<body>
    <h1>fase runtuh</h1>

    <p class="quote">"Tak perlu khawatir, ku hanya <span>terluka</span>. <br>
        Terbiasa tuk pura-pura tertawa. <br>
        Namun bolehkah sekali saja ku menangis? <br>
        Sebelum kembali membohongi diri."
    </p>

    <p class="credit">— feby putri feat. fiersa besari</p>
</body>
</html>
